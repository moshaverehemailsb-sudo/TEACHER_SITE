services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: baf
      POSTGRES_PASSWORD: baf
      POSTGRES_DB: baf
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U baf -d baf" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://baf:baf@db:5432/baf
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
